replicaCount: 2

image:
  repository: REGION-docker.pkg.dev/PROJECT_ID/reliability-platform/web-ui   # set by scripts/deploy_aws.sh or deploy_gcp.sh
  tag: ""   # set to the git SHA at deploy time (Gatekeeper blocks :latest)
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 80

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

probes:
  liveness:
    path: /
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    path: /
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 3

serviceAccount:
  name: platform-workload   # created by the deploy script; on GKE it is bound to a Google SA for Workload Identity
