# Values for the community kube-prometheus-stack chart — this directory
# holds values, not a standalone chart. Install with:
#
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm upgrade --install global-monitoring prometheus-community/kube-prometheus-stack \
#     --namespace monitoring --create-namespace \
#     -f platform/helm/global-monitoring/values.yaml
#
# This is the cloud counterpart to the local docker-compose stack's
# prometheus/grafana/alertmanager services — same alert.rules.yml and
# alertmanager.yml content, deployed cluster-wide instead of per-container.

prometheus:
  prometheusSpec:
    scrapeInterval: 15s
    additionalScrapeConfigs:
      - job_name: 'flask-api'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['platform']
      - job_name: 'node-api'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['platform']

alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: platform-webhook
      group_by: ['alertname', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - match:
            severity: critical
          receiver: platform-webhook
          group_wait: 10s
    receivers:
      - name: platform-webhook
        slack_configs:
          - api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
            channel: '#incidents'
            send_resolved: true

grafana:
  adminUser: admin
  adminPassword: admin
  dashboardsConfigMaps:
    default: "grafana-dashboards"
  # Datasources are provisioned by the chart's sidecar — no clicking through
  # the Grafana UI, and no hardcoded service DNS (the sidecar fills in the
  # in-cluster URLs itself). These are the chart defaults, spelled out here
  # so you can see what Grafana comes up with:
  #   Prometheus   uid "prometheus"   (default datasource)
  #   Alertmanager uid "alertmanager" (reads the firing alerts)
  # The uids matter: monitoring/grafana-dashboard.json pins uid "prometheus"
  # on every panel, so don't rename it without editing the dashboard too.
  sidecar:
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
      isDefaultDatasource: true
      name: Prometheus
      uid: prometheus
      defaultDatasourceScrapeInterval: 15s
      alertmanager:
        enabled: true
        name: Alertmanager
        uid: alertmanager
        implementation: prometheus
        handleGrafanaManagedAlerts: false
    dashboards:
      enabled: true
