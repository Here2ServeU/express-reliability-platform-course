global:
  scrape_interval: 15s   # Visit every service every 15 seconds

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - 'alert.rules.yml'

scrape_configs:
  - job_name: 'flask-api'
    static_configs:
      - targets: ['flask-api:5000']   # Container port — NOT host port 5050

  # Carried forward from V5. V8's local docker-compose stack has no
  # node-api service, so this target shows as DOWN — that's expected; see
  # the README troubleshooting section. Delete this job for a clean
  # targets page, or keep it as a reminder of what a real multi-service
  # platform's scrape config looks like.
  - job_name: 'node-api'
    static_configs:
      - targets: ['node-api:3000']
