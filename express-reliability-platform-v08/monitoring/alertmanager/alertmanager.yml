global:
  resolve_timeout: 5m

route:
  receiver: platform-webhook
  group_by: ['alertname', 'severity']
  group_wait: 30s        # Wait 30s to batch alerts from the same group
  group_interval: 5m     # Wait 5m before sending another alert from the same group
  repeat_interval: 4h    # Re-send if still firing after 4 hours
  routes:
    - match:
        severity: critical
      receiver: platform-webhook
      group_wait: 10s     # Critical alerts get shorter wait time
    - match:
        severity: warning
      receiver: platform-webhook

receivers:
  # Points at the same Slack Incoming Webhook the AIOps scripts use
  # (SLACK_WEBHOOK_URL — see README section 10, Step C). Replace the
  # placeholder below or template it in before deploying.
  - name: platform-webhook
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
        channel: '#incidents'
        username: 'ReliabilityBot'
        icon_emoji: ':rotating_light:'
        send_resolved: true
        title: '{{ template "slack.default.title" . }}'
        text: |
          *Alert:* {{ .CommonLabels.alertname }}
          *Severity:* {{ .CommonLabels.severity | toUpper }}
          *Summary:* {{ .CommonAnnotations.summary }}
          *Description:* {{ .CommonAnnotations.description }}
          *Status:* {{ .Status | toUpper }}
